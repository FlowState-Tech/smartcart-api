# Spring DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcart_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Google Maps Directions API (Shopping Journey)
smartcart.maps.provider=google
smartcart.maps.google.api-key=${GOOGLE_MAPS_API_KEY:}