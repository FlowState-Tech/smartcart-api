# Perfil local: sin PostgreSQL — ideal para probar Swagger en tu PC
spring.datasource.url=jdbc:h2:mem:smartcart_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

authorization.jwt.secret=dev-local-secret-key-at-least-32-chars
authorization.jwt.expiration.days=7

decolecta.api.token=
smartcart.maps.provider=fallback
