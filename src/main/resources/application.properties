# Spring Application Name
spring.application.name=smartcart-api

# Perfil activo: "dev" usa PostgreSQL | "local" usa H2 en memoria (sin instalar nada)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Spring Data JPA Configuration
spring.jpa.show-sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.naming.physical-strategy=com.smartcart.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
authorization.jwt.secret = ${AUTHORIZATION_JWT_SECRET}
authorization.jwt.expiration.days = ${AUTHORIZATION_JWT_EXPIRATION_DAYS}


# Flyway Configuration
spring.flyway.enabled=false

# Security debug logging (disable in prod)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}

# Configuración de Decolecta
decolecta.api.base-url=https://api.decolecta.com/v1
decolecta.api.token=${DECOLECTA_API_TOKEN:}

# Maps integration (Shopping Journey) — requires Directions API on the Google Cloud key
smartcart.maps.provider=${SMARTCART_MAPS_PROVIDER:google}
smartcart.maps.google.api-key=${GOOGLE_MAPS_API_KEY:}