# Spring Application Name
spring.application.name=smartcart-api

# Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Spring Data JPA Configuration
spring.jpa.show-sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.naming.physical-strategy=com.smartcart.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
authorization.jwt.secret = ${AUTHORIZATION_JWT_SECRET}
authorization.jwt.expiration.days = ${AUTHORIZATION_JWT_EXPIRATION_DAYS}

# Flyway Configuration
spring.flyway.enabled=false

# Security debug logging
logging.level.org.springframework.security=DEBUG
